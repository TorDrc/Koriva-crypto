name: KORIVA Scanner

on:
  schedule:
    # Toutes les 15 minutes.
    # NOTE: GitHub peut décaler de quelques minutes en période de charge.
    - cron: '*/15 * * * *'
  workflow_dispatch:      # bouton "Run workflow" manuel dans l'onglet Actions

permissions:
  contents: write         # nécessaire pour commit data.json

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure docs directory exists
        run: mkdir -p docs

      - name: Run scanner (JSON output)
        run: python scanner_v2.py --json > docs/data.json
        continue-on-error: true

      - name: Fallback if scanner failed
        if: failure() || success()
        run: |
          if [ ! -s docs/data.json ]; then
            echo '{"error":"Scanner produced no output","scan_time":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > docs/data.json
          fi

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update scanner data [skip ci]"
            git push
          fi
