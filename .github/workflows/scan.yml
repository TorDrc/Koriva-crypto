name: KORIVA Scanner

on:
  schedule:
    # Toutes les 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: koriva-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run scanner
        # Binance renvoie 451 (geo-block) depuis les IP US des runners GitHub.
        # Si tu as un proxy non-US, ajoute-le en secret BINANCE_PROXY.
        env:
          BINANCE_PROXY: ${{ secrets.BINANCE_PROXY }}
        run: |
          python scanner_v2.py --json --backtest > data.json.tmp
          mv data.json.tmp data.json

      - name: Commit and push data.json
        run: |
          git config user.name "koriva-bot"
          git config user.email "koriva-bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update data.json [skip ci]"
          git push
